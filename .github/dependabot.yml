---
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      oxc:
        patterns:
          - "oxc*"
      php-parser:
        patterns:
          - "php-rs-parser"
          - "php-ast"
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'rust-toolchain'
    directory: '/'
    schedule:
      interval: 'weekly'
