name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to comment on a pull request using octocov
      contents: write # to store the reports in the octocov-reports branch using octocov
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: llvm-tools-preview # required by cargo-llvm-cov
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-llvm-cov
      # cccc-rb builds Ruby's Prism from vendored C via bindgen, which needs libclang.
      - name: Install libclang (for the ruby-prism / bindgen build)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # Runs the workspace tests and emits an LCOV report for octocov in one pass.
      - name: Run tests & measure coverage (cargo-llvm-cov -> LCOV)
        run: cargo llvm-cov --workspace --all-targets --all-features --lcov --output-path coverage.lcov
      # Passes the LCOV report to octocov so it can comment on pull requests and
      # store the coverage report in the octocov-reports datastore branch.
      - name: Run octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # cccc-rb builds Ruby's Prism from vendored C via bindgen, which needs libclang.
      - name: Install libclang (for the ruby-prism / bindgen build)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
