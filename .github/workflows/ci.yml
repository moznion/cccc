name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to comment on a pull request using octocov
      contents: write # to store the reports in the octocov-reports branch using octocov
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview # required by cargo-llvm-cov
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-llvm-cov
      # cccc-rb builds Ruby's Prism from vendored C via bindgen, which needs libclang.
      - name: Install libclang (for the ruby-prism / bindgen build)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # Runs the workspace tests and emits an LCOV report for octocov in one pass.
      - name: Run tests & measure coverage (cargo-llvm-cov -> LCOV)
        run: cargo llvm-cov --workspace --all-targets --all-features --lcov --output-path coverage.lcov
      # Passes the LCOV report to octocov so it can comment on pull requests and
      # store the coverage report in the octocov-reports datastore branch.
      - name: Run octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # cccc-rb builds Ruby's Prism from vendored C via bindgen, which needs libclang.
      - name: Install libclang (for the ruby-prism / bindgen build)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The crates.io release ships cccc-cli without Kotlin (cccc-kt depends on a
  # git-only grammar). Check that build and the packaging of every crate here,
  # so problems surface on the PR instead of in the post-release publish job.
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # cccc-rb builds Ruby's Prism from vendored C via bindgen, which needs libclang.
      - name: Install libclang (for the ruby-prism / bindgen build)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Test cccc-cli without Kotlin
        run: cargo test -p cccc-cli --no-default-features
      - name: Dry-run the crates.io publish
        run: .github/scripts/publish-crates.sh --dry-run
