name: tagpr

# Keeps a release pull request open for the unreleased changes on main. Merging
# it makes tagpr tag the merge commit and create a *draft* GitHub Release; the
# `build` job (release-build.yml) builds the unified `cccc` binary for every
# target and attests its provenance, then the `release` job attaches the
# archives to the draft and publishes it. The repository has immutable releases
# enabled, so a published release (its assets and tag) can no longer change.
#
# The tag is pushed with GITHUB_TOKEN, which does not trigger `on: push: tags`
# workflows, so the assets are built in this workflow directly. The `publish`
# job then publishes the workspace crates of the same tag to crates.io.
# Run it manually with a tag to finish a release left as a draft (e.g. a failed
# build) or to resume a failed crates.io publish (versions already there are
# skipped); the tagpr job is skipped in that case.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2.3)
        required: true
        type: string

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tagpr.postVersionCommand runs `cargo update --workspace` to sync Cargo.lock.
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - id: tagpr
        uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: tagpr
    # Runs after tagpr cut a tag, or on a manual dispatch (tagpr skipped).
    if: >-
      !cancelled() && !failure()
      && (needs.tagpr.outputs.tag != '' || github.event_name == 'workflow_dispatch')
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag || inputs.tag }}

  release:
    needs: [tagpr, build]
    if: >-
      !cancelled() && !failure()
      && (needs.tagpr.outputs.tag != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cccc-*
          path: dist
          merge-multiple: true

      # Attach the assets to tagpr's draft and only then publish it, since an
      # immutable release rejects asset changes once published.
      - name: Upload assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tagpr.outputs.tag || inputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::notice::release $TAG is already published; its assets are immutable, so leaving them as is"
            exit 0
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # cccc-kt is not published (its Kotlin grammar is a git dependency), so the
  # crates.io cccc-cli is built without Kotlin; see .github/scripts/publish-crates.sh.
  publish:
    needs: tagpr
    # Runs after tagpr cut a tag, or on a manual dispatch (tagpr skipped).
    if: >-
      !cancelled() && !failure()
      && (needs.tagpr.outputs.tag != '' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      # crates.io Trusted Publishing: the script exchanges the job's OIDC token
      # for short-lived crates.io tokens, so no long-lived secret is needed.
      id-token: write
    runs-on: ubuntu-latest
    # New crates are rate-limited by crates.io; the script waits out 429s.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tagpr.outputs.tag || inputs.tag }}
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # cccc-rb builds Ruby's Prism from vendored C via bindgen, which needs
      # libclang for the verification build.
      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Publish crates
        run: .github/scripts/publish-crates.sh
