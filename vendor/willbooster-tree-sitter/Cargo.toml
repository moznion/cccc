# Generated by .github/scripts/vendor-willbooster-tree-sitter.sh from
# willbooster-tree-sitter 23.1.0; regenerate instead of editing by hand.
[package]
name = "cccc-willbooster-tree-sitter"
version = "23.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/moznion/cccc"
description = "WillBooster's tree-sitter runtime fork (willbooster-tree-sitter 23.1.0), repackaged with prefixed C symbols so it links next to upstream tree-sitter; used by cccc-cs"
readme = "README.md"
build = "binding_rust/build.rs"
links = "cccc-willbooster-tree-sitter"
include = [
    "/binding_rust/*",
    "/Cargo.toml",
    "/src/*.h",
    "/src/*.c",
    "/src/portable/*",
    "/src/unicode/*",
    "/src/wasm-stdlib/**/*",
    "/include/tree_sitter/api.h",
    "/symbols.txt",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "tree_sitter"
path = "binding_rust/lib.rs"

[features]
default = ["std"]
std = []

[dependencies]
tree-sitter-language = "0.1.8"

[build-dependencies]
cc = "1.2.63"

# Upstream code, kept as is: the `wasm` and `bindgen` features are dropped
# (their cfgs stay in the source), and its lints are not this workspace's.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("wasm", "bindgen"))', "cfg(docsrs)"] }
mismatched_lifetime_syntaxes = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
